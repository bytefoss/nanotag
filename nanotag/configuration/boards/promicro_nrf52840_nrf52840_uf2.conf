# nice!nano v2 / Pro Micro nRF52840 with the Adafruit UF2 bootloader.

# Use the RC oscillator so it runs on clones without a 32.768 kHz crystal.
# If EID rotation or connections look flaky on a board that has the crystal,
# switch to CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Logs go over USB CDC ACM. Minimal/immediate logging blocks the caller (the cooperative system
# work queue, where Fast Pair runs) until the Mac reads the port, which stalls USB and Bluetooth.
# Deferred mode buffers logs in a low-priority thread and drops them when nobody is reading.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=16384

# Debug aid: hold logs for 5 s after boot so the Mac can reopen the USB port and catch the boot log.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000

# Battery sensing: read the real LiPo level via the SoC-internal VDDHDIV5 ADC input.
CONFIG_ADC=y
